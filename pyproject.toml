[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opus5-lean"
version = "0.1.0"
description = "Token-efficiency toolkit for Claude Opus 5: count, slim, cache-plan, and sweep effort to get the best output per token."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "consecrating" }]
keywords = ["claude", "opus-5", "anthropic", "tokens", "prompt-caching", "llm", "cost-optimization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
]

# The core (count/slim/cache/cost) is pure stdlib on purpose: it must run
# anywhere, with no install step and no network. Only live API calls need extra.
dependencies = []

[project.optional-dependencies]
live = ["httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
opus5-lean = "opus5lean.cli:main"

[project.urls]
Repository = "https://github.com/consecrating/Claude-Opus5"

[tool.hatch.build.targets.wheel]
packages = ["src/opus5lean"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
